<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>查看json格式数据</title>
	<link href="css/bootstrap.min.css" type="text/css" rel="stylesheet">
	<link href="css/htmleaf-demo.css" type="text/css" rel="stylesheet">
	<link href="css/jquery.json-viewer.css" type="text/css" rel="stylesheet" />
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3270513881388000"
			crossorigin="anonymous"></script>
</head>
<body>
	<div class="htmleaf-container">
		<header class="htmleaf-header">
			<h1>查看json格式数据</h1>
			<div class="htmleaf-links">
				<a class="htmleaf-icon icon-htmleaf-home-outline" href="" title="刷新页"></a>
				<a class="htmleaf-icon icon-htmleaf-arrow-forward-outline" href="" title="新开页" target="_blank"></a>
			</div>
		</header>
		<div class="container"  style="margin-top: 1em;">
			<div class="row">
				<textarea class="form-control" id="json-input" rows="15" >
{
	"jobs":[
		{
			"task_name":"任务1",
			"sub_task_num":1
		},
		{
			"task_name":"任务2",
			"sub_task_num":2
		}
	]
}
				</textarea>
				<label class="checkbox-inline">
				  <input type="checkbox" id="collapsed"> 收缩所有的节点
				</label>
				<label class="checkbox-inline">
				  <input type="checkbox" id="with-quotes"> 为Key添加双引号
				</label>
				<div class="form-group" style="padding: 1em 0;">
				<button id="btn-json-viewer" class="btn btn-info" title="run jsonViewer()">转换Json数据</button>
				</div>
				<pre id="json-renderer"></pre>
			</div>
		</div>
	</div>
	

	 <script src="js/jquery.min.js"></script>
	 <script src="js/jquery.json-viewer.js"></script>
	 <script type="text/javascript">
	 	$(function() {
		  $('#btn-json-viewer').click(function() {
		    try {
		      var input = eval('(' + $('#json-input').val() + ')');
		    }
		    catch (error) {
		      return alert("Cannot eval JSON: " + error);
		    }
		    var options = {
		      collapsed: $('#collapsed').is(':checked'),
		      withQuotes: $('#with-quotes').is(':checked')
		    };
		    $('#json-renderer').jsonViewer(input, options);
		  });

		  // Display JSON sample on load
		  $('#btn-json-viewer').click();
		});
	 </script>
</body>
</html>
